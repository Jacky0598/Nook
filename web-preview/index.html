<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>校园帮 · 小程序原型预览</title>
<style>
  :root{
    --brand:#2E5BFF; --brand-soft:#EAF0FF; --price:#FF6B35;
    --ink:#16181D; --ink2:#5A616E; --ink3:#9AA0AA;
    --line:#EDEFF3; --bg:#F5F6F8; --ok:#12B76A; --warn:#F79009;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
    background:#E8EAEF; color:var(--ink);
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:28px 16px 60px;
  }
  .head{text-align:center;margin-bottom:22px;max-width:760px}
  .head h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
  .head p{font-size:13px;color:var(--ink2);margin-top:8px;line-height:1.6}
  .head .note{font-size:12px;color:var(--ink3);margin-top:10px}

  /* 手机外壳 */
  .phone{
    width:390px;height:800px;background:#fff;border-radius:38px;
    box-shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 10px #1A1D23;
    overflow:hidden;display:flex;flex-direction:column;position:relative;
  }
  .statusbar{
    height:44px;background:#fff;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:13px;font-weight:600;flex-shrink:0;
  }
  .navbar{
    height:44px;background:#fff;display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:600;border-bottom:1px solid var(--line);flex-shrink:0;position:relative;
  }
  .navback{position:absolute;left:16px;font-size:20px;color:var(--ink2);cursor:pointer;display:none}
  .navback.on{display:block}
  .body{flex:1;overflow-y:auto;background:var(--bg);scrollbar-width:thin}
  .body::-webkit-scrollbar{width:4px}
  .body::-webkit-scrollbar-thumb{background:#D3D7DE;border-radius:2px}

  .tabbar{
    height:56px;background:#fff;border-top:1px solid var(--line);
    display:flex;flex-shrink:0;padding-bottom:2px;
  }
  .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-size:11px;color:var(--ink3);cursor:pointer;gap:3px}
  .tb .ic{font-size:19px;filter:grayscale(1);opacity:.5}
  .tb.on{color:var(--brand);font-weight:600}
  .tb.on .ic{filter:none;opacity:1}

  /* 通用 */
  .card{background:#fff;border-radius:12px;padding:15px;margin:0 12px 10px}
  .sec{display:flex;justify-content:space-between;align-items:baseline;padding:16px 12px 8px}
  .sec h3{font-size:16px;font-weight:600}
  .sec span{font-size:12px;color:var(--ink3)}
  .muted{color:var(--ink3);font-size:12px}
  .badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;margin-right:4px;line-height:1.5}
  .b-verify{background:#E7F6EC;color:var(--ok)}
  .b-hd{background:#FFF3E6;color:var(--warn)}
  .b-license{background:var(--brand-soft);color:var(--brand)}
  .b-ghost{background:#F2F3F5;color:var(--ink2)}
  .price{color:var(--price);font-weight:600}
  .price b{font-size:18px}
  .price s{font-size:11px;font-weight:400;text-decoration:none}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 16px;
       border-radius:15px;font-size:13px;border:none;cursor:pointer;font-family:inherit}
  .btn-p{background:var(--brand);color:#fff}
  .btn-g{background:#fff;color:var(--brand);border:1px solid var(--brand)}
  .stars{color:var(--warn);font-weight:600}
  .av{border-radius:50%;background:linear-gradient(135deg,#2E5BFF,#7B9BFF);color:#fff;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600}

  /* 首页 */
  .top{background:#fff;padding:10px 12px 12px}
  .search{display:flex;align-items:center;height:38px;background:var(--bg);border-radius:19px;padding:0 14px;gap:6px}
  .search input{flex:1;border:none;background:none;font-size:13px;outline:none;font-family:inherit}
  .school{display:inline-flex;align-items:center;margin-top:10px;background:var(--brand-soft);
          border-radius:12px;padding:4px 10px;font-size:12px;color:var(--brand);font-weight:500;cursor:pointer}
  .cats{display:flex;background:#fff;padding:4px 6px 16px;margin-bottom:4px}
  .cat{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer}
  .cat i{width:44px;height:44px;border-radius:13px;background:var(--bg);display:flex;
         align-items:center;justify-content:center;font-size:20px;font-style:normal}
  .cat span{font-size:11px;color:var(--ink2)}

  .lt{font-size:15px;font-weight:600;line-height:1.45}
  .srow{display:flex;align-items:center;margin-top:11px;gap:8px}
  .srow .av{width:32px;height:32px;font-size:14px}
  .sname{font-size:13px;font-weight:500}
  .ssub{font-size:11px;color:var(--ink3)}
  .stat{display:flex;align-items:center;gap:5px;margin-top:8px;font-size:12px}
  .tags{margin-top:8px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11px;color:var(--ink2);background:var(--bg);padding:3px 8px;border-radius:4px}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;
        padding-top:11px;border-top:1px solid var(--line)}

  .chip{display:inline-block;font-size:11px;color:var(--brand);background:var(--brand-soft);
        padding:4px 8px;border-radius:4px;margin:0 5px 4px 0}
  .rdesc{font-size:13px;color:var(--ink2);line-height:1.6;margin-top:7px}

  /* explore */
  .tabs{display:flex;gap:20px;margin-top:11px;overflow-x:auto;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}
  .tabi{font-size:13px;color:var(--ink2);padding:6px 0;white-space:nowrap;cursor:pointer;position:relative}
  .tabi.on{color:var(--brand);font-weight:600}
  .tabi.on::after{content:'';position:absolute;left:50%;bottom:0;transform:translateX(-50%);
                  width:20px;height:3px;border-radius:2px;background:var(--brand)}
  .tools{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
  .sorts{display:flex;gap:7px}
  .sortb{font-size:12px;color:var(--ink2);background:var(--bg);border-radius:4px;padding:5px 10px;cursor:pointer}
  .sortb.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
  .cmpb{font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
  .cmpb.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .hint{font-size:11.5px;color:var(--brand);background:var(--brand-soft);margin:8px 12px 0;
        padding:9px 11px;border-radius:7px;line-height:1.5}
  .cmpwrap{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 4px}
  .cmpwrap::-webkit-scrollbar{height:4px}
  .cmpcol{width:145px;flex-shrink:0;background:#fff;border-radius:9px;padding:11px;border:1.5px solid var(--brand)}
  .cmpcol h4{font-size:14px;margin-bottom:7px}
  .cmpc{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-top:1px solid var(--line)}
  .cmpc i{font-size:11px;color:var(--ink3);font-style:normal}
  .cmpc b{font-size:12px;font-weight:500}
  .row{display:flex;gap:11px;cursor:pointer}
  .row.on{border:1.5px solid var(--brand)}
  .ck{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:flex;
      align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
  .ck.on{background:var(--brand);border-color:var(--brand);color:#fff}

  /* post */
  .hero{padding:28px 24px 20px}
  .hero h2{font-size:22px;font-weight:700}
  .hero p{font-size:13px;color:var(--ink3);margin-top:6px}
  .opt{display:flex;gap:12px;background:#fff;border-radius:12px;margin:0 12px 12px;padding:18px 14px;cursor:pointer}
  .opt.o1{border-left:4px solid var(--price)}
  .opt.o2{border-left:4px solid var(--brand)}
  .opt .oi{font-size:26px;line-height:1.2}
  .opt h4{font-size:17px;font-weight:600}
  .opt p{font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:6px}
  .eg{display:block;font-size:11.5px;color:var(--ink3);background:var(--bg);border-radius:4px;
      padding:5px 8px;margin-top:6px}
  .rules{background:#FFF8E6;border-radius:11px;margin:10px 12px;padding:14px}
  .rules h5{font-size:13px;color:#B54708;margin-bottom:7px}
  .rules div{font-size:11.5px;color:#B54708;line-height:1.85}

  /* form */
  .form{background:#fff;margin:10px 12px;border-radius:11px;padding:4px 14px}
  .fld{padding:14px 0;border-bottom:1px solid var(--line);position:relative}
  .fld:last-child{border-bottom:none}
  .fld label{display:block;font-size:13px;font-weight:500;margin-bottom:8px}
  .fld input,.fld textarea,.fld select{width:100%;font-size:14px;background:var(--bg);
    border:none;border-radius:6px;padding:9px 10px;outline:none;font-family:inherit;color:var(--ink)}
  .fld textarea{height:90px;resize:none;line-height:1.6}
  .fhint{display:block;font-size:11px;color:var(--ink3);margin-top:6px;line-height:1.5}
  .agree{display:flex;gap:8px;padding:4px 22px 0;cursor:pointer}
  .agree .cb{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--ink3);
             display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0;margin-top:2px}
  .agree .cb.on{background:var(--brand);border-color:var(--brand)}
  .agree span{font-size:11.5px;color:var(--ink2);line-height:1.6}

  /* detail */
  .dhero{background:#fff;padding:18px 14px;margin-bottom:10px}
  .dhero h2{font-size:19px;font-weight:700;line-height:1.4}
  .metrics{display:flex;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .met{flex:1;text-align:center}
  .met b{font-size:18px;display:block}
  .met i{font-size:11px;color:var(--ink3);font-style:normal}
  .blk h4{font-size:15px;font-weight:600;margin-bottom:9px}
  .blk p{font-size:13.5px;color:var(--ink2);line-height:1.75}
  .bd{background:#FBFCFF;border:1px solid var(--brand-soft)}
  .bdr{display:flex;gap:8px;font-size:12.5px;line-height:1.7;margin-bottom:6px}
  .bd-y{color:var(--ok)} .bd-n{color:#D92D20}
  .rv{padding:12px 0;border-bottom:1px solid var(--line)}
  .rv:last-of-type{border-bottom:none}
  .rvh{display:flex;align-items:center;gap:7px}
  .rvh .av{width:22px;height:22px;font-size:11px}
  .actionbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);
             padding:9px 12px;display:flex;gap:10px}
  .actionbar .btn{height:42px;border-radius:21px;font-size:15px}
  .actionbar .btn-g{width:90px}
  .actionbar .btn-p{flex:1}

  /* message */
  .conv{display:flex;align-items:center;gap:11px;background:#fff;padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer}
  .conv .av{width:42px;height:42px;font-size:16px}
  .conv .av.sys{background:linear-gradient(135deg,#F79009,#FDB022)}
  .cvb{flex:1;min-width:0}
  .cvt{display:flex;align-items:center;gap:6px}
  .cvt b{font-size:14.5px;font-weight:500}
  .cvt i{margin-left:auto;font-size:11px;color:var(--ink3);font-style:normal}
  .cvl{font-size:12.5px;color:var(--ink3);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{min-width:17px;height:17px;border-radius:9px;background:#F04438;color:#fff;font-size:10px;
       display:flex;align-items:center;justify-content:center;padding:0 4px}
  .tip{font-size:11.5px;color:var(--ink2);background:#FFF8E6;margin:12px;padding:12px;border-radius:8px;line-height:1.7}

  /* me */
  .uh{display:flex;align-items:center;gap:13px;background:#fff;padding:22px 14px 18px}
  .uh .av{width:60px;height:60px;font-size:24px}
  .uh h2{font-size:19px;font-weight:700}
  .upsell{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#2E5BFF,#5B7BFF);
          border-radius:11px;margin:10px 12px;padding:14px;cursor:pointer}
  .upsell h4{font-size:14.5px;font-weight:600;color:#fff}
  .upsell p{font-size:11.5px;color:rgba(255,255,255,.85);margin-top:5px;line-height:1.6}
  .upsell i{font-size:22px;color:rgba(255,255,255,.7);font-style:normal}
  .rtab{display:flex;background:#fff;margin:10px 12px 0;border-radius:9px;padding:4px}
  .rtab div{flex:1;text-align:center;font-size:13.5px;padding:9px 0;border-radius:6px;color:var(--ink2);cursor:pointer}
  .rtab div.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  .stats{display:flex;background:#fff;margin:10px 12px 0;border-radius:11px;padding:16px 0}
  .stt{flex:1;text-align:center}
  .stt b{font-size:18px;display:block}
  .stt i{font-size:11px;color:var(--ink3);font-style:normal}
  .cells{background:#fff;margin:10px 12px;border-radius:11px;overflow:hidden}
  .cell{display:flex;align-items:center;justify-content:space-between;padding:14px;
        font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
  .cell:last-child{border-bottom:none}
  .cell i{color:var(--ink3);font-size:17px;font-style:normal}

  .fnote{text-align:center;font-size:11px;color:var(--ink3);padding:14px 30px 20px;line-height:1.7}
  .empty{text-align:center;padding:50px 30px}
  .empty div:first-child{font-size:36px}
  .empty h4{font-size:14px;margin-top:10px;font-weight:500}
  .empty p{font-size:12px;color:var(--ink3);margin-top:6px;line-height:1.6}

  /* toast */
  #toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);
    color:#fff;padding:14px 20px;border-radius:10px;font-size:13.5px;max-width:280px;line-height:1.65;
    z-index:99;opacity:0;pointer-events:none;transition:opacity .18s;white-space:pre-line;text-align:center}
  #toast.on{opacity:1}

  /* ===== 手机上打开时：去掉外壳，直接全屏 ===== */
  @media (max-width:560px){
    body{padding:0;background:#fff;display:block}
    .head{display:none}
    .mobile-banner{display:block}
    .phone{
      width:100%;height:100dvh;border-radius:0;box-shadow:none;
    }
    .statusbar{display:none}
    .navbar{padding-top:env(safe-area-inset-top);height:calc(44px + env(safe-area-inset-top))}
    .tabbar{padding-bottom:calc(2px + env(safe-area-inset-bottom));
            height:calc(56px + env(safe-area-inset-bottom))}
  }
  .mobile-banner{
    display:none;background:var(--brand-soft);color:var(--brand);
    font-size:11.5px;text-align:center;padding:7px 14px;line-height:1.5;
  }
</style>
</head>

function query(){
  let a=L.slice();
  if(S.cat!=='all')a=a.filter(x=>x.cat===S.cat);
  if(S.kw){const k=S.kw.toUpperCase();
    a=a.filter(x=>x.title.toUpperCase().includes(k)||x.codes.some(c=>c.includes(k)));}
  if(S.sort==='price')a.sort((x,y)=>x.price-y.price);
  else if(S.sort==='orders')a.sort((x,y)=>y.s.oc-x.s.oc);
  else a.sort((x,y)=>y.s.rating-x.s.rating);
  return a;
}

const TABS=[['index','首页','🏠'],['explore','找服务','🔍'],['post','发布','➕'],['message','消息','💬'],['me','我的','👤']];
const SUB=['detail','publish'];

function go(t){if(SUB.includes(t))S.stack.push(S.tab);S.tab=t;document.getElementById('body').scrollTop=0;render();}
function back(){S.tab=S.stack.pop()||'index';render();}
function openDetail(id){S.detail=L.find(x=>x.id===id);go('detail');}
function pick(id){
  const i=S.sel.indexOf(id);
  if(i>-1)S.sel.splice(i,1);
  else{if(S.sel.length>=3)return toast('最多对比 3 个');S.sel.push(id);}
  render();
}
function submitPost(){
  const title=(document.getElementById('p_title')||{}).value||'';
  const desc=(document.getElementById('p_desc')||{}).value||'';
  if(!title)return toast('请填写标题');
  if(!S.agreed)return toast('请先阅读并同意发布规范');
  const banned=['代写','代考','代课','代刷','代签到','包过','答案','past exam','ghostwrit'];
  const txt=(title+desc).toLowerCase();
  const hit=banned.find(w=>txt.includes(w.toLowerCase()));
  if(hit)return toast('❌ 内容不符合规范\n\n检测到敏感词「'+hit+'」。\n平台禁止代写代考、售卖答案等学术不端服务，\n也禁止转售受版权保护的课程材料。');
  toast('✅ 已提交\n\n原型演示：真实环境会写入数据库\n并进入人工审核队列。');
  setTimeout(back,1400);
}
function render(){
  const t=S.tab;
  document.getElementById('navtitle').textContent=typeof TITLES[t]==='function'?TITLES[t]():TITLES[t];
  document.querySelector('.navback').classList.toggle('on',SUB.includes(t));
  document.getElementById('body').innerHTML=P[t]();
  document.getElementById('tabbar').innerHTML=TABS.map(x=>
    `<div class="tb ${S.tab===x[0]?'on':''}" onclick="S.stack=[];go('${x[0]}')"><span class="ic">${x[2]}</span>${x[1]}</div>`).join('');
}
render();
</script>
</body>
